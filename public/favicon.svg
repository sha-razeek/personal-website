<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Nucleus -->
  <circle cx="16" cy="16" r="3.5" fill="#4A3020"/>
  
  <!-- Orbits -->
  <g stroke="#49848A" stroke-width="1.5">
    <ellipse cx="16" cy="16" rx="14" ry="5.5" transform="rotate(0 16 16)"/>
    <ellipse cx="16" cy="16" rx="14" ry="5.5" transform="rotate(60 16 16)"/>
    <ellipse cx="16" cy="16" rx="14" ry="5.5" transform="rotate(120 16 16)"/>
  </g>
  
  <!-- Electrons -->
  <circle cx="2" cy="16" r="2.5" fill="#D05E3C"/>
  <circle cx="23" cy="28.1" r="2.5" fill="#D8A048"/>
  <circle cx="23" cy="3.9" r="2.5" fill="#49848A"/>
</svg>
